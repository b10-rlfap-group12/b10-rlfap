<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">B10 RLFAP MiniZinc Project</title>
  <desc id="desc">Animated radio-link frequency assignment network visualization</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071A33"/><stop offset="1" stop-color="#123B61"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <g stroke="#00B4D8" stroke-width="2" opacity=".55">
    <path d="M95 175 L260 80 L440 170 L620 72 L815 168 L1060 84" fill="none"/>
    <path d="M260 80 L440 170 L815 168 L1060 84" fill="none"/>
  </g>
  <g fill="#00B4D8" filter="url(#glow)">
    <circle cx="95" cy="175" r="7"><animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="80" r="7"><animate attributeName="r" values="7;12;7" dur="2.4s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="170" r="7"><animate attributeName="r" values="7;12;7" dur="1.8s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="72" r="7"><animate attributeName="r" values="7;12;7" dur="2.2s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="168" r="7"><animate attributeName="r" values="7;12;7" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="84" r="7"><animate attributeName="r" values="7;12;7" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="29" font-weight="700">B10 · RLFAP · MiniZinc</text>
  <text x="600" y="225" text-anchor="middle" fill="#BDEFF7" font-family="Arial, sans-serif" font-size="17">Constraint programming · Solver comparison · CELAR validation</text>
</svg>
